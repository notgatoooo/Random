<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

#dvd {
    position: fixed;
    left: 0;
    top: 0;
    font-size: 48px;
    font-weight: bold;
    white-space: nowrap;
    user-select: none;
    pointer-events: none;
    will-change: transform;
}
</style>
</head>
<body>

<div id="dvd">you're gay lol</div>

<script>
const dvd = document.getElementById("dvd");

let x = Math.random() * (window.innerWidth * 0.5);
let y = Math.random() * (window.innerHeight * 0.5);

let dx = 4;
let dy = 4;

function randomColor() {
    return `hsl(${Math.random() * 360}, 100%, 60%)`;
}

function randomString(length) {
    const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let result = "";

    for (let i = 0; i < length; i++) {
        result += chars[Math.floor(Math.random() * chars.length)];
    }

    return result;
}

setInterval(() => {
    document.title = randomString(
        Math.floor(Math.random() * 9) + 8
    );
}, 50);

setInterval(() => {
    history.replaceState(
        null,
        "",
        "/" + randomString(
            Math.floor(Math.random() * 9) + 8
        )
    );
}, 50);

dvd.style.color = randomColor();

function animate() {
    const w = dvd.offsetWidth;
    const h = dvd.offsetHeight;

    x += dx;
    y += dy;

    if (x <= 0) {
        x = 0;
        dx = Math.abs(dx);
        dvd.style.color = randomColor();
    }

    if (x + w >= window.innerWidth) {
        x = window.innerWidth - w;
        dx = -Math.abs(dx);
        dvd.style.color = randomColor();
    }

    if (y <= 0) {
        y = 0;
        dy = Math.abs(dy);
        dvd.style.color = randomColor();
    }

    if (y + h >= window.innerHeight) {
        y = window.innerHeight - h;
        dy = -Math.abs(dy);
        dvd.style.color = randomColor();
    }

    dvd.style.transform = `translate(${x}px, ${y}px)`;

    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize", () => {
    const w = dvd.offsetWidth;
    const h = dvd.offsetHeight;

    if (x + w > window.innerWidth) {
        x = window.innerWidth - w;
    }

    if (y + h > window.innerHeight) {
        y = window.innerHeight - h;
    }
});
</script>

</body>
</html>
