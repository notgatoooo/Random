<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>.'s Personal Profile</title>
    <style>
        :root {
            --bg-color-1: #020202;
            --bg-color-2: #121212;
            --accent-color: #090909;
            --track-empty: rgba(255, 255, 255, 0.20);
            --track-filled: rgba(255, 255, 255, 0.10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, var(--bg-color-1), var(--bg-color-2));
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background 0.8s ease;
            overflow: hidden;
        }

        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(135deg, var(--bg-color-1), var(--bg-color-2));
            transition: background 0.8s ease, opacity 0.8s ease;
        }

        .noise-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.3'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: opacity 0.65s ease, visibility 0.65s ease;
        }

        .loading-screen.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-text {
            color: #fff;
            font-size: 1rem;
            letter-spacing: 0.4px;
            font-weight: 600;
            text-shadow: 0 2px 12px rgba(0,0,0,0.65);
        }

        .loading-bar {
            width: 180px;
            height: 4px;
            border-radius: 999px;
            background: rgba(255,255,255,0.12);
            overflow: hidden;
            position: relative;
        }

        .loading-bar::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 42%;
            border-radius: inherit;
            background: #fff;
            animation: loadingSweep 1.05s ease-in-out infinite;
            box-shadow: 0 0 14px rgba(255,255,255,0.35);
        }

        @keyframes loadingSweep {
            0% {
                transform: translateX(-130%);
            }
            100% {
                transform: translateX(330%);
            }
        }

        .glass-box {
            position: relative;
            z-index: 10;
            backdrop-filter: blur(80px);
            -webkit-backdrop-filter: blur(80px);
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid color-mix(in srgb, var(--accent-color) 35%, rgba(255,255,255,0.1));
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
            color: #fff;
            transition:
                transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
                opacity 0.75s ease,
                border-color 0.8s ease,
                box-shadow 0.8s ease;
            opacity: 0;
            transform: translateY(18px) scale(0.94);
            pointer-events: none;
        }

        .glass-box.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .profile-modal {
            width: 90%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 35px 25px 20px 25px;
            border-radius: 24px;
            margin-bottom: 20px;
        }

        .profile-modal:hover {
            transform: translateY(-5px) scale(1.01);
            border-color: color-mix(in srgb, var(--accent-color) 55%, rgba(255,255,255,0.2));
        }

        .profile-wrapper {
            position: relative;
            flex-shrink: 0;
            width: 98px;
            height: 98px;
            padding: 3px;
            border-radius: 50%;
            background: var(--status-color, #747f8d);
            box-shadow: 0 0 10px color-mix(in srgb, var(--status-color, #747f8d) 80%, transparent), 0 5px 18px rgba(0,0,0,0.45);
        }

        #pfp {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            object-fit: cover;
            display: block;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        #pfp.loaded {
            opacity: 1;
            transform: scale(1);
        }

        .status-online {
            --status-color: #43b581;
        }

        .status-idle {
            --status-color: #faa61a;
        }

        .status-dnd {
            --status-color: #f04747;
        }

        .status-offline {
            --status-color: #747f8d;
        }

        #username {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
            margin-top: 5px;
        }

        .quote-container {
            font-size: 1rem;
            font-weight: 300;
            font-style: italic;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.4;
            max-width: 95%;
            min-height: 1.8em;
            margin-bottom: 5px;
            text-align: center;
        }
        
        .cursor {
            display: inline-block;
            width: 1px;
            animation: blink 1s infinite;
            color: rgba(255,255,255,0.5);
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .socials {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .social-btn {
            color: #fff;
            transition: all 0.3s ease, background 0.8s ease, border-color 0.8s ease, box-shadow 0.8s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            background: color-mix(in srgb, var(--accent-color) 14%, rgba(255, 255, 255, 0.05));
            padding: 10px;
            border-radius: 12px;
            border: 1px solid color-mix(in srgb, var(--accent-color) 30%, transparent);
            text-decoration: none;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset;
        }

        .social-btn svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        
        .social-btn:hover {
            background: color-mix(in srgb, var(--accent-color) 36%, rgba(255, 255, 255, 0.10));
            border-color: color-mix(in srgb, var(--accent-color) 72%, rgba(255, 255, 255, 0.18));
            transform: scale(1.1);
            box-shadow: 0 0 20px color-mix(in srgb, var(--accent-color) 55%, rgba(255, 255, 255, 0.12));
        }

        .footer-credit {
            font-size: 0.65rem;
            font-weight: 200;
            font-style: italic;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 15px;
            letter-spacing: 0.5px;
            pointer-events: none;
        }

        .player-modal {
            width: 90%;
            max-width: 380px;
            padding: 15px 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.65);
            border-color: color-mix(in srgb, var(--accent-color) 25%, rgba(255,255,255,0.1));
        }

        .player-modal:hover {
            transform: translateY(-5px) scale(1.01);
        }

        .album-art {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .player-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            text-align: left;
        }

        .track-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.7rem;
            font-weight: 300;
            font-style: italic;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
            margin-bottom: 6px;
        }

        .seek-container {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .time-text {
            font-size: 0.6rem;
            font-family: monospace;
            color: rgba(255, 255, 255, 0.6);
            min-width: 30px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
            height: 18px;
        }
        
        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 10px;
            width: 10px;
            border-radius: 50%;
            background: #fff;
            margin-top: -3px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            border-radius: 2px;
            background: linear-gradient(to right, var(--track-filled) 0%, var(--track-filled) var(--seek-percent, 0%), var(--track-empty) var(--seek-percent, 0%), var(--track-empty) 100%);
        }
        
        input[type=range]::-moz-range-thumb {
            height: 10px;
            width: 10px;
            border: none;
            border-radius: 50%;
            background: #fff;
        }

        input[type=range]::-moz-range-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            border-radius: 2px;
            background: var(--track-empty);
        }

        input[type=range]::-moz-range-progress {
            height: 4px;
            border-radius: 2px;
            background: var(--track-filled);
        }

        .play-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid color-mix(in srgb, var(--accent-color) 30%, rgba(255,255,255,0.12));
            border-radius: 14px;
            cursor: pointer;
            color: #fff;
            padding: 8px;
            transition: color 0.2s ease, filter 0.8s ease, background 0.3s ease, border-color 0.3s ease;
        }

        .play-btn:hover {
            color: #fff;
            transform: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: color-mix(in srgb, var(--accent-color) 35%, rgba(255,255,255,0.18));
        }

        .play-btn svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        @media screen and (max-height: 650px) {
            body {
                justify-content: flex-start;
                overflow-y: auto;
                padding: 20px 0;
            }
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>
    <div class="noise-layer"></div>

    <div id="loadingScreen" class="loading-screen">
        <div class="loading-text">Loading...</div>
        <div class="loading-bar"></div>
    </div>

    <div class="glass-box profile-modal">
        <div id="profileWrapper" class="profile-wrapper status-offline">
            <img id="pfp" crossorigin="anonymous" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="User Avatar">
        </div>

        <div id="username">Loading, Please Wait... ;)</div>

        <div class="quote-container">
            <span id="typewriter-text"></span><span class="cursor">|</span>
        </div>

        <div class="socials">
            <a href="https://instagram.com/81892s" target="_blank" class="social-btn" title="Instagram">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                </svg>
            </a>
        </div>

        <div class="footer-credit">Made By Gato (@not_.gato)</div>
    </div>

    <div class="glass-box player-modal">
        <img src="https://random.getunx.cc/Assets/%40lzzzx_assets/Cover.jpg" alt="Art" class="album-art">
        
        <div class="player-info">
            <div class="track-name">GANKIN’ LAMEZ</div>
            <div class="track-artist">By Insomniac</div>
            
            <div class="seek-container">
                <span id="currTime" class="time-text">0:00</span>
                <input type="range" id="seekSlider" value="0" min="0" max="100" step="0.01">
                <span id="durTime" class="time-text">0:00</span>
            </div>
        </div>

        <button id="playBtn" class="play-btn">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <audio id="audio" src="https://random.getunx.cc/Assets/%40lzzzx_assets/Sound.mp3" preload="auto"></audio>
    </div>

    <script>
        const userID = "586568393801596928";

        const loadingScreen = document.getElementById('loadingScreen');
        const profileModal = document.querySelector('.profile-modal');
        const playerModal = document.querySelector('.player-modal');
        const audio = document.getElementById('audio');
        const pfp = document.getElementById('pfp');
        const coverArt = document.querySelector('.album-art');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const seekSlider = document.getElementById('seekSlider');
        const currTimeText = document.getElementById('currTime');
        const durTimeText = document.getElementById('durTime');
        const typewriterElement = document.getElementById('typewriter-text');
        const usernameEl = document.getElementById('username');
        const profileWrapper = document.getElementById('profileWrapper');

        let isPlaying = false;
        let isDragging = false;
        let smoothValue = 0;
        let typewriterStarted = false;

        function waitForImage(img) {
            return new Promise(resolve => {
                if (img.complete && img.naturalWidth > 0) {
                    resolve();
                    return;
                }

                const done = () => resolve();
                img.addEventListener('load', done, { once: true });
                img.addEventListener('error', done, { once: true });
            });
        }

        function waitForAudioReady(media) {
            return new Promise(resolve => {
                if (media.readyState >= 4) {
                    resolve();
                    return;
                }

                const done = () => resolve();
                media.addEventListener('canplaythrough', done, { once: true });
                media.addEventListener('loadeddata', done, { once: true });
                media.addEventListener('loadedmetadata', done, { once: true });
            });
        }

        function updateSeekVisual(percent) {
            const clamped = Math.max(0, Math.min(100, Number(percent) || 0));
            seekSlider.style.setProperty('--seek-percent', `${clamped}%`);
        }

        async function fetchDiscordData() {
            const response = await fetch(`https://api.lanyard.rest/v1/users/${userID}`);
            const json = await response.json();

            if (!json.success) {
                throw new Error('Discord fetch failed');
            }

            const data = json.data;
            const discordUser = data.discord_user;
            const status = data.discord_status;

            const avatarHash = discordUser.avatar;
            const avatarUrl = avatarHash
                ? `https://cdn.discordapp.com/avatars/${userID}/${avatarHash}.png?size=256`
                : `https://cdn.discordapp.com/embed/avatars/${parseInt(discordUser.discriminator) % 5}.png`;

            pfp.classList.remove('loaded');
            pfp.src = avatarUrl;
            usernameEl.innerText = discordUser.username;

            profileWrapper.className = 'profile-wrapper';
            if (status === 'online') profileWrapper.classList.add('status-online');
            else if (status === 'idle') profileWrapper.classList.add('status-idle');
            else if (status === 'dnd') profileWrapper.classList.add('status-dnd');
            else profileWrapper.classList.add('status-offline');

            await waitForImage(pfp);
            pfp.classList.add('loaded');
        }

        function typeWriter(textToType) {
            if (typewriterStarted) return;
            typewriterStarted = true;

            let charIndex = 0;

            function step() {
                if (charIndex < textToType.length) {
                    typewriterElement.innerHTML += textToType.charAt(charIndex);
                    charIndex++;
                    setTimeout(step, 120);
                }
            }

            step();
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function smoothUpdate() {
            if (!isDragging && audio.duration && isFinite(audio.duration)) {
                const target = (audio.currentTime / audio.duration) * 100;
                smoothValue = lerp(smoothValue, target, 0.15);
                seekSlider.value = smoothValue;
                updateSeekVisual(smoothValue);
            }
            requestAnimationFrame(smoothUpdate);
        }

        async function startPage() {
            try {
                audio.preload = 'auto';
                audio.load();

                await Promise.all([
                    fetchDiscordData(),
                    waitForImage(coverArt),
                    waitForAudioReady(audio)
                ]);
            } catch (e) {
                console.error(e);
            }

            loadingScreen.classList.add('hide');
            profileModal.classList.add('visible');
            playerModal.classList.add('visible');

            setTimeout(() => {
                typeWriter('goat');
            }, 250);

            try {
                const playPromise = audio.play();
                if (playPromise) {
                    await playPromise;
                    isPlaying = true;
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                }
            } catch (error) {
                isPlaying = false;
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }

        setInterval(fetchDiscordData, 30000);
        smoothUpdate();

        playBtn.addEventListener('click', async () => {
            if (isPlaying) {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                isPlaying = false;
            } else {
                try {
                    await audio.play();
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    isPlaying = true;
                } catch (e) {}
            }
        });

        seekSlider.addEventListener('pointerdown', () => {
            isDragging = true;
        });

        seekSlider.addEventListener('pointerup', () => {
            const seekTime = (Number(seekSlider.value) / 100) * audio.duration;
            if (audio.duration && isFinite(audio.duration)) {
                audio.currentTime = seekTime;
                smoothValue = Number(seekSlider.value);
                updateSeekVisual(smoothValue);
            }
            isDragging = false;
        });

        seekSlider.addEventListener('pointercancel', () => {
            const seekTime = (Number(seekSlider.value) / 100) * audio.duration;
            if (audio.duration && isFinite(audio.duration)) {
                audio.currentTime = seekTime;
                smoothValue = Number(seekSlider.value);
                updateSeekVisual(smoothValue);
            }
            isDragging = false;
        });

        seekSlider.addEventListener('input', () => {
            const percent = Number(seekSlider.value) || 0;
            updateSeekVisual(percent);

            if (audio.duration && isFinite(audio.duration)) {
                const seekTime = (percent / 100) * audio.duration;
                currTimeText.innerText = formatTime(seekTime);
                audio.currentTime = seekTime;
            }
        });

        audio.addEventListener('timeupdate', () => {
            if (!isDragging) {
                const currentPercent = (audio.currentTime / audio.duration) * 100;
                seekSlider.value = currentPercent || 0;
                updateSeekVisual(currentPercent || 0);
                currTimeText.innerText = formatTime(audio.currentTime);
            }
            durTimeText.innerText = formatTime(audio.duration);
        });

        audio.addEventListener('loadedmetadata', () => {
            durTimeText.innerText = formatTime(audio.duration);
            updateSeekVisual(0);
        });

        audio.addEventListener('durationchange', () => {
            durTimeText.innerText = formatTime(audio.duration);
        });

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        audio.volume = 0.5;
        updateSeekVisual(0);
        startPage();
    </script>
</body>
</html>
