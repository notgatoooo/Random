<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gato's Personal Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 100%;
            height: 100vh;
            background-color: #05070d;
            color: #eaeaff;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        #scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .ball {
            position: absolute;
            border-radius: 50%;
            filter: blur(160px);
            opacity: 0.55;
        }

        .noise-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.3'/%3E%3C/svg%3E");
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        .glass-box {
            position: relative;
            z-index: 10;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(10, 14, 40, 0.7);
            border: 1px solid rgba(80, 120, 255, 0.25); 
            border-top: 1px solid rgba(80, 120, 255, 0.4);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
            color: #fff;
        }

        .profile-modal {
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; 
            padding: 35px 25px 20px 25px;
            border-radius: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .profile-wrapper { position: relative; flex-shrink: 0; }

        #pfp {
            width: 90px; height: 90px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.15);
            object-fit: cover;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            display: block;
        }

        .status-dot {
            position: absolute; bottom: 4px; right: 4px;
            width: 18px; height: 18px;
            border-radius: 50%;
            border: 3px solid #0a0e28;
        }
        
        .status-online { background-color: #43ff9a; box-shadow: 0 0 8px #43ff9a; }
        .status-idle { background-color: #ffd24d; box-shadow: 0 0 8px #ffd24d; }
        .status-dnd { background-color: #ff4d4d; box-shadow: 0 0 8px #ff4d4d; }
        .status-offline { background-color: #777; }

        #username {
            font-size: 1.5rem; 
            font-weight: 800;
            letter-spacing: -1px; 
            line-height: 1.1;
            margin-top: 5px;
        }

        .grad {
            display: inline-block;
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent !important;
            -webkit-text-fill-color: transparent;
            animation: walk 6s ease-in-out infinite;
            font-weight: 800;
            text-decoration: none;
        }
        
        .grad-blue-purple { background-image: linear-gradient(90deg, #2a5cff, #7a4dff, #2a5cff); }
        .grad-blue-dark { background-image: linear-gradient(90deg, #2a6bff, #0b1a55, #2a6bff); }
        .grad-python { background-image: linear-gradient(90deg, #2a6bff, #ffd24d, #ffffff, #2a6bff); }
        .grad-luau { background-image: linear-gradient(90deg, #2a6bff, #ffffff, #2a6bff); }
        
        .gray-italic { color: #9aa0b8; font-style: italic; }

        @keyframes walk {
            0% { background-position: 0% 50% }
            50% { background-position: 100% 50% }
            100% { background-position: 0% 50% }
        }

        .quote-container {
            font-size: 0.9rem; 
            font-weight: 400;
            color: #eaeaff;
            line-height: 1.6; 
            max-width: 100%;
            min-height: 110px;
            margin-bottom: 5px;
            text-align: center;
        }
        
        .cursor {
            display: inline-block; width: 10px; height: 1.2em;
            background: #2a6bff;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 2px;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .socials { 
            display: flex; 
            gap: 10px; 
            margin-top: 10px; 
            flex-wrap: wrap; 
            justify-content: center; 
        }
        .social-btn {
            color: #fff; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1); 
            text-decoration: none;
        }
        .social-btn svg, .social-btn img { width: 18px; height: 18px; }
        .social-btn svg { fill: currentColor; }
        .social-btn svg.lucide { fill: none; stroke: currentColor; stroke-width: 2; }
        .social-btn:hover {
            background: rgba(42, 107, 255, 0.2); 
            border-color: #2a6bff;
            transform: scale(1.1); 
        }

        .footer-credit {
            font-size: 0.6rem; font-weight: 300;
            color: rgba(255, 255, 255, 0.3); margin-top: 15px;
        }

        .player-modal {
            width: 90%; max-width: 450px;
            padding: 15px 20px;
            border-radius: 20px;
            display: flex; align-items: center; gap: 15px;
            background: rgba(5, 7, 13, 0.75); 
            border: 1px solid rgba(80, 120, 255, 0.15);
        }

        .album-art { width: 55px; height: 55px; border-radius: 10px; object-fit: cover; }
        .player-info { flex: 1; display: flex; flex-direction: column; overflow: hidden; text-align: left; }
        .track-name { font-size: 0.85rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 0.7rem; color: #9aa0b8; margin-bottom: 6px; }
        .seek-container { display: flex; align-items: center; gap: 8px; width: 100%; }
        .time-text { font-size: 0.65rem; color: #9aa0b8; min-width: 30px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 10px; width: 10px; border-radius: 50%; background: #2a6bff; margin-top: -3px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; }
        .play-btn { background: none; border: none; cursor: pointer; color: #fff; transition: transform 0.2s; }
        .play-btn:hover { transform: scale(1.1); color: #2a6bff; }
        .play-btn svg { width: 28px; height: 28px; fill: currentColor; }

        @media screen and (max-height: 750px) {
            body { justify-content: flex-start; overflow-y: auto; padding: 20px 0; }
        }
    </style>

    <script>
        const scene = document.getElementById("scene");
        const bgColors = ["#050b1e","#081028","#0a1230","#0b255f"];
        for(let i=0; i<8; i++){
            const b = document.createElement("div"); b.className = "ball";
            const s = 520 + Math.random() * 520;
            b.style.width = b.style.height = s + "px";
            b.style.background = bgColors[Math.floor(Math.random() * bgColors.length)];
            b.style.left = Math.random() * 100 + "%"; b.style.top = Math.random() * 100 + "%";
            scene.appendChild(b);
        }

        const userID = "1333631679570645082";
        async function fetchDiscordData() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${userID}`);
                const json = await response.json();
                if (json.success) {
                    const u = json.data;
                    document.getElementById('pfp').src = u.discord_user.avatar ? `https://cdn.discordapp.com/avatars/${userID}/${u.discord_user.avatar}.png?size=256` : `https://cdn.discordapp.com/embed/avatars/0.png`;
                    document.getElementById('username').innerHTML = `Hey i'm <span class="grad grad-blue-purple">${u.discord_user.username}</span>!`;
                    const s = document.getElementById('status');
                    s.className = 'status-dot status-' + u.discord_status;
                }
            } catch (e) {}
        }
        fetchDiscordData();
        setInterval(fetchDiscordData, 30000);

        const textToType = 'I am currently working on <a href="https://getunx.cc/?utm_source=Gato%27s%20Profile" target="_blank" class="grad grad-blue-dark">UNXHub</a>, <span class="gray-italic">my only project.</span><br><br>Currently learning: <span class="grad grad-python">Python 3.X</span>, <span class="grad grad-luau">LUAU</span>';
        const typeWriterElement = document.getElementById('typewriter-text');
        let charIndex = 0;
        function typeWriter() {
            if (charIndex < textToType.length) {
                if (textToType.charAt(charIndex) === '<') {
                    const tagEnd = textToType.indexOf('>', charIndex);
                    typeWriterElement.innerHTML += textToType.substring(charIndex, tagEnd + 1);
                    charIndex = tagEnd + 1;
                } else {
                    typeWriterElement.innerHTML += textToType.charAt(charIndex);
                    charIndex++;
                }
                setTimeout(typeWriter, 35);
            }
        }
        setTimeout(typeWriter, 500);

        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const seekSlider = document.getElementById('seekSlider');
        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (isPlaying) { audio.pause(); playIcon.style.display='block'; pauseIcon.style.display='none'; }
            else { audio.play(); playIcon.style.display='none'; pauseIcon.style.display='block'; }
            isPlaying = !isPlaying;
        });

        audio.addEventListener('timeupdate', () => {
            const progress = (audio.currentTime / audio.duration) * 100;
            seekSlider.value = progress || 0;
            document.getElementById('currTime').innerText = formatTime(audio.currentTime);
            document.getElementById('durTime').innerText = formatTime(audio.duration);
        });

        seekSlider.addEventListener('input', () => { audio.currentTime = (seekSlider.value / 100) * audio.duration; });

        function formatTime(s) {
            if (isNaN(s)) return "0:00";
            const m = Math.floor(s / 60); const sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? '0' : ''}${sec}`;
        }
        audio.volume = 0.5;
    </script>
